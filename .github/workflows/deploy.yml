name: Deploy to Vercel

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
    branches: [master, main]

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    # 仅发布本仓库主分支 push 的成功构建，不能发布 PR 的候选提交。
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["master", "main"]'), github.event.workflow_run.head_branch)

    steps:
      - name: Check Vercel secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "❌ VERCEL_TOKEN secret is not set"
            echo "Please configure Vercel secrets in repository settings"
            exit 1
          fi
          echo "✅ Vercel secrets are configured"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # workflow_run 默认指向默认分支；部署必须绑定到实际通过 CI 的提交。
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"

      - name: Deployment Success
        run: |
          echo "🚀 Successfully deployed to Vercel!"
          echo "✅ Production deployment completed"
          echo "🌐 Live URL: https://mz-tools.alandeng.cc"
          echo ""
          echo "📋 Deployment Details:"
          echo "   • Project: mz-tools"
          echo "   • Environment: Production"
          echo "   • Status: ✅ Success"
          echo "   • Vercel URL: ${{ steps.deploy.outputs.preview-url }}"
