name: Deploy to Vercel

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
    branches: [master, main]

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    # 只在CI成功时运行
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check Vercel secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "❌ VERCEL_TOKEN secret is not set"
            echo "Please configure Vercel secrets in repository settings"
            exit 1
          fi
          echo "✅ Vercel secrets are configured"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Deployment Success
        run: |
          echo "🚀 Successfully deployed to Vercel!"
          echo "✅ Production deployment completed"
          echo "🌐 Live URL: ${{ steps.deploy.outputs.preview-url }}"
          echo ""
          echo "📋 Deployment Details:"
          echo "   • Project: mz-tools"
          echo "   • Environment: Production"
          echo "   • Status: ✅ Success"
          echo "   • URL: ${{ steps.deploy.outputs.preview-url }}"
